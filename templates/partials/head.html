  <!-- ====================================================================
       Google-Tag mit Consent Mode

       Reihenfolge ist hier alles: der consent-default MUSS vor dem Laden von
       gtag.js stehen. Was Google vor dem ersten Default sieht, behandelt es als
       uneingeschraenkt erlaubt — ein spaeter nachgereichter Default wird
       ignoriert. Wer diese drei Bloecke umsortiert, hebelt die Einwilligung aus,
       ohne dass man es der Seite ansieht.

       Solange "denied" gilt, setzt GA KEINE Cookies und sendet nur einen
       anonymen Ping. Erst der consent-update aus js/site.js (applyConsent)
       schaltet die volle Messung frei.

       Das Tag steht bewusst fest im Quelltext: Googles Installationspruefung
       ruft die Seite ab und sucht es dort. Wird es per JavaScript nachgeladen,
       findet sie es nie und meldet dauerhaft "not installed" — deswegen steht
       es hier und nicht in loadAnalytics().
       ==================================================================== -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('consent', 'default', {
      analytics_storage: 'denied',
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied',
      wait_for_update: 500
    });
  </script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DQBC6VLYFP"></script>
  <script>
    gtag('js', new Date());
    gtag('config', 'G-DQBC6VLYFP');
  </script>

  <script src="{{root}}js/icons.js?v={{v.iconsJs}}" defer></script>
  <script src="{{root}}js/site.js?v={{v.siteJs}}" defer></script>

  <!-- Kleine Zusatzstile nur fuer die generierten Seiten. Bewusst inline statt
       in css/site.css: so muss beim Regenerieren kein ?v= auf den 9 von Hand
       gepflegten Seiten angefasst werden. Aenderungen hier gelten nach dem
       naechsten `npm run build:pages` fuer alle generierten Seiten. -->
  <style>
    /* H1 auf den generierten Seiten in Space Grotesk statt Doto (Marcel,
       2026-08-29). --font-ui = "Space Grotesk" aus css/site.css; das engere
       Tracking gleicht aus, dass die Doto-Laufweite (.03em) fuer die dotted
       Schrift gedacht war. */
    .subpage h1 { font-family: var(--font-ui); letter-spacing: -0.01em; }
    .page-hero { margin: 4px 0 22px; }
    .page-hero img { display: block; width: 100%; height: auto; max-height: 300px; object-fit: cover; border: 2px solid var(--ink); border-radius: 14px; box-shadow: var(--shadow-hard); background: var(--white); }
    .crumbs { font-size: 13px; color: var(--ink-55); margin: 0 0 18px; }
    .crumbs a { color: var(--ink-55); text-decoration: underline; text-underline-offset: 2px; }
    .crumbs span[aria-current] { color: var(--ink); }
    .crumbs .sep { margin: 0 6px; }
    /* Geraete-Fakten als unauffaellige Meta-Zeile mit Punkt-Trennern —
       bewusst KEINE Pill-Optik, das saehe klickbar aus (Marcel, 2026-08-31). */
    .device-facts { list-style: none; padding: 0; margin: 0 0 16px; display: flex; flex-wrap: wrap; gap: 4px 8px; max-width: none; }
    .device-facts li { font-size: 14px; color: var(--ink-55); margin: 0; }
    .device-facts li:not(:first-child)::before { content: "·"; margin-right: 8px; }
    .hub-group { margin-top: 34px; }
    .hub-list { list-style: none; margin: 0; padding: 0; max-width: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .hub-list li { margin: 0; }
    .subpage a.hub-card { text-decoration: none; }
    .hub-card { display: block; border: 2px solid var(--ink); background: var(--white); border-radius: 12px; padding: 14px 16px; text-decoration: none; box-shadow: var(--shadow-hard); }
    .hub-card:hover { background: var(--green); }
    .hub-card--soon { box-shadow: none; border-style: dashed; }
    .hub-card--soon:hover { background: var(--white); }
    .hub-card__name { font-weight: 600; font-size: 16px; color: var(--ink); margin: 0; }
    .hub-card__meta { font-size: 13px; color: var(--ink-55); margin: 4px 0 0; }
    /* Der Download-Knopf ist der einzige echte Handlungsaufruf der Seite:
       zentriert und groesser als jeder andere anklickbare Punkt. */
    .page-cta { text-align: center; margin: 26px 0 10px; max-width: none; }
    .subpage .page-cta__btn { font-size: 18px; padding: 16px 34px; min-height: 60px; gap: 10px;
      white-space: nowrap; flex-wrap: nowrap; }

    /* Related players sind bewusst KEINE Knoepfe mehr: als Pillen standen sie
       optisch in Konkurrenz zum CTA. Jetzt schlichte Textlinks (Marcel, 2026-09-01). */
    .related-kopf { font-size: 13px !important; text-transform: uppercase; letter-spacing: .09em;
      color: var(--ink-55); font-weight: 600; margin: 30px 0 8px !important; }
    .subpage ul.related-list { list-style: none; margin: 0 0 16px; padding-left: 0;
      display: flex; flex-wrap: wrap; gap: 4px 0; max-width: none; }
    .related-list li { margin: 0; color: var(--ink-55); font-size: 15px; }
    .related-list li:not(:last-child)::after { content: "·"; margin: 0 9px; color: var(--ink-55); }
    .subpage .related-list a { color: var(--ink-55); text-decoration: underline;
      text-underline-offset: 3px; text-decoration-thickness: 1px; }
    .subpage .related-list a:hover { color: var(--ink); }
    .page-faq { display: flex; flex-direction: column; gap: 12px; margin: 0 0 14px; }
    /* Quirks buendig ohne Bullets — die Standard-Listeneinrueckung der
       Subpage wirkte hier neben den buendigen Absaetzen verrutscht
       (Marcel, 2026-08-31). */
    .subpage ul.page-quirks { list-style: none; padding-left: 0; }
    .subpage .page-quirks li { margin-bottom: 10px; }
    /* Prozess-Schaufenster (templates/partials/process.html) */
    .proc-grid { display: grid; gap: 20px; margin: 0 0 18px; }
    @media (min-width: 720px) { .proc-grid { grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); align-items: stretch; } }
    .proc-grid > * { min-width: 0; }
    .proc-stage { position: relative; min-height: 19rem; }
    .proc-panel { display: none; height: 100%; border: 2px solid var(--ink); border-radius: 14px; padding: 16px; box-shadow: var(--shadow-hard); }
    .proc-panel.is-active { display: flex; }
    .proc-panel--01 { background: var(--green); }
    .proc-panel--02 { background: var(--purple); }
    .proc-panel--03 { background: var(--red); }
    .proc-panel--04 { background: var(--beige); }
    .proc-panel .demo-panel { box-shadow: none; min-width: 0; }
    /* Abstand Stick-Zeile -> Track-Boxen im Export-Panel. Bewusst hier im
       Inline-Style statt als Tailwind-Utility: der Style-Block steckt im HTML
       der Seite und kann nicht wie tailwind.css im Browser-Cache veralten
       (genau das hat diesen Abstand zweimal verschluckt). */
    .proc-export-list { margin-top: 30px !important; }
    /* Arc-Preset-Buttons: js/site.js rendert sie fuer die breite Landing-Spalte;
       hier ist die Spalte schmaler, deshalb kompakt erzwingen. */
    .proc-panel--02 [data-arc-buttons] { flex-wrap: wrap !important; }
    .proc-panel--02 [data-arc-buttons] button { flex: 0 0 auto !important; padding: 4px 10px !important; font-size: 11px !important; }
    /* Refine-Demo: echter Platztausch. Der rote Balken wird angehoben und
       einen Slot nach rechts gezogen; der verdraengte schwarze Balken springt
       auf die alte Position des roten. Danach tauschen beide zurueck. Nur
       Translation — die Balkenhoehen bleiben konstant (bewusst KEINE
       Equalizer-Optik; Marcel, 2026-08-31). Slot-Distanz = eigene Breite +
       3px Gap, deshalb calc(100% + 3px) statt fester Pixel. */
    @media (prefers-reduced-motion: no-preference) {
      .proc-dragbar { position: relative; z-index: 2; animation: proc-drag 6s ease-in-out infinite; }
      .proc-swapbar { position: relative; z-index: 1; animation: proc-swap 6s ease-in-out infinite; }
    }
    @keyframes proc-drag {
      0%   { transform: translate(0, 0); }
      7%   { transform: translate(0, -7px); }
      22%  { transform: translate(calc(100% + 3px), -7px); }
      29%  { transform: translate(calc(100% + 3px), 0); }
      50%  { transform: translate(calc(100% + 3px), 0); }
      57%  { transform: translate(calc(100% + 3px), -7px); }
      72%  { transform: translate(0, -7px); }
      79%  { transform: translate(0, 0); }
      100% { transform: translate(0, 0); }
    }
    @keyframes proc-swap {
      0%   { transform: translateX(0); }
      14%  { transform: translateX(0); }
      26%  { transform: translateX(calc(-100% - 3px)); }
      62%  { transform: translateX(calc(-100% - 3px)); }
      74%  { transform: translateX(0); }
      100% { transform: translateX(0); }
    }
    .proc-steps { display: flex; flex-direction: column; justify-content: center; gap: 2px; position: relative; }
    /* Weisser Pill hinter dem aktiven Titel; gleitet per JS (movePill) zur
       jeweils aktiven Position. Erster Aufruf passiert vor dem ersten Paint,
       deshalb kein Einflug von (0,0). */
    .proc-pill { position: absolute; top: 0; left: 0; background: var(--white); border: 2px solid var(--ink); border-radius: 999px; box-shadow: var(--shadow-hard); transition: transform .35s ease, width .35s ease, height .35s ease; will-change: transform; }
    @media (prefers-reduced-motion: reduce) { .proc-pill { transition: none; } }
    .proc-step { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 8px 0 8px 16px; cursor: pointer; opacity: .38; transition: opacity .3s; font: inherit; color: inherit; position: relative; z-index: 1; }
    .proc-step.is-active { opacity: 1; }
    .proc-step__num { display: inline-block; font-size: clamp(22px, 3vw, 30px); margin-bottom: 0; }
  </style>
